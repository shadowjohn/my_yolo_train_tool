<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Template Lab — VRMA-first Pose Importer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101827;
      --panel-strong: #162033;
      --text: #e6edf7;
      --muted: #9fb0c8;
      --line: rgba(148, 163, 184, 0.28);
      --accent: #2dd4bf;
      --accent-strong: #67e8f9;
      --danger: #fca5a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .lab-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 460px);
    }

    .lab-stage {
      position: relative;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 17, 31, 0.1), rgba(5, 10, 18, 0.78)),
        radial-gradient(circle at 35% 30%, #19394f 0, #07111f 46%, #050a12 100%);
    }

    .lab-header {
      position: absolute;
      z-index: 2;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: rgba(5, 10, 18, 0.72);
      backdrop-filter: blur(10px);
    }

    .lab-header strong {
      font-size: 16px;
      line-height: 1.2;
    }

    .lab-header span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
    }

    #labLoadState {
      margin-left: auto;
      color: var(--accent-strong);
      white-space: nowrap;
    }

    .lab-viewport {
      position: absolute;
      inset: 72px 20px 20px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      background: rgba(5, 10, 18, 0.24);
    }

    .lab-viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lab-panel {
      overflow: auto;
      max-height: 100vh;
      padding: 24px;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }

    .lab-panel h1,
    .lab-panel h2,
    .lab-panel p {
      margin-top: 0;
    }

    .lab-panel h1 {
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.25;
    }

    .lab-panel h2 {
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.3;
    }

    .lab-panel p {
      margin-bottom: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    button,
    .lab-file,
    .lab-example {
      border: 1px solid rgba(45, 212, 191, 0.45);
      background: rgba(15, 23, 42, 0.88);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }

    button {
      min-height: 42px;
      cursor: pointer;
    }

    button:hover,
    .lab-file:hover,
    .lab-example:hover {
      border-color: rgba(103, 232, 249, 0.76);
      background: rgba(22, 32, 51, 0.95);
    }

    button:active {
      transform: translateY(1px);
    }

    .lab-file,
    .lab-example {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .lab-file input,
    .lab-example select {
      width: 100%;
      color: var(--muted);
    }

    .lab-example select {
      min-height: 38px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      background: #050a12;
      color: var(--text);
      padding: 8px 10px;
    }

    .lab-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .lab-slider {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
    }

    .lab-slider input {
      width: 100%;
      accent-color: var(--accent);
    }

    .lab-slider output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .lab-preview-control {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.64);
    }

    .lab-preview-control legend {
      padding: 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .lab-preview-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .lab-preview-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      background: #050a12;
      color: var(--text);
      cursor: pointer;
    }

    .lab-summary {
      display: grid;
      gap: 8px;
      margin: 0 0 18px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: var(--panel-strong);
    }

    .lab-summary div {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
    }

    .lab-summary dt {
      color: var(--muted);
    }

    .lab-summary dd {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--text);
    }

    .lab-warning-panel,
    .lab-json-panel,
    .lab-mining-panel {
      margin-top: 18px;
    }

    .lab-mining-panel {
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.64);
    }

    .lab-mining-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .lab-field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .lab-field-full {
      grid-column: 1 / -1;
    }

    .lab-field select,
    .lab-field input,
    .lab-field textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      background: #050a12;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    .lab-field textarea {
      min-height: 76px;
      resize: vertical;
    }

    .lab-field select:disabled {
      opacity: 0.42;
    }

    .lab-mining-actions {
      margin: 12px 0;
    }

    .lab-mining-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .lab-mining-list li {
      padding: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      background: rgba(5, 10, 18, 0.36);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .lab-mining-list strong {
      color: var(--text);
    }

    .lab-warning-panel ul {
      margin: 0;
      padding: 12px 12px 12px 30px;
      min-height: 44px;
      border: 1px solid rgba(252, 165, 165, 0.24);
      border-radius: 8px;
      background: rgba(127, 29, 29, 0.18);
      color: var(--danger);
    }

    pre {
      white-space: pre-wrap;
      overflow: auto;
      max-height: 320px;
      background: #050a12;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 12px;
      color: #dbeafe;
      font: 12px/1.5 Consolas, "Cascadia Mono", monospace;
    }

    @media (max-width: 860px) {
      .lab-shell {
        grid-template-columns: 1fr;
      }

      .lab-stage {
        min-height: 58vh;
      }

      .lab-header {
        flex-wrap: wrap;
      }

      #labLoadState {
        margin-left: 0;
      }

      .lab-panel {
        max-height: none;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 480px) {
      .lab-panel {
        padding: 18px;
      }

      .lab-actions,
      .lab-summary div,
      .lab-mining-grid,
      .lab-preview-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="lab-shell">
    <section class="lab-stage" aria-label="Alicia pose preview">
      <header class="lab-header">
        <strong>Motion Template Lab</strong>
        <span>VRMA-first Pose Importer</span>
        <span id="labLoadState">載入中</span>
      </header>
      <div id="labViewport" class="lab-viewport"></div>
    </section>

    <aside class="lab-panel" aria-label="VRMA pose importer controls">
      <h1>動作範本匯入器</h1>
      <p>載入 VRMA，取樣上半身姿勢，匯出 NaturalPosePreset JSON。</p>

      <label class="lab-file">
        <span>載入 VRMA</span>
        <input id="vrmaFileInput" type="file" accept=".vrma,model/gltf-binary">
      </label>

      <label class="lab-example">
        <span>範例動作</span>
        <select id="exampleVrmaSelect">
          <option value="Angry.vrma">Angry.vrma</option>
          <option value="Clapping.vrma">Clapping.vrma</option>
          <option value="Goodbye.vrma">Goodbye.vrma</option>
          <option value="Jump.vrma">Jump.vrma</option>
          <option value="LookAround.vrma">LookAround.vrma</option>
          <option value="Relax.vrma">Relax.vrma</option>
          <option value="Sad.vrma">Sad.vrma</option>
          <option value="Sleepy.vrma">Sleepy.vrma</option>
          <option value="Surprised.vrma">Surprised.vrma</option>
          <option value="Thinking.vrma">Thinking.vrma</option>
        </select>
        <button id="btnLoadExample" type="button">載入範例</button>
      </label>

      <div class="lab-actions">
        <button id="btnSampleFirst" type="button">取第一幀</button>
        <button id="btnSampleTime" type="button">取指定時間</button>
        <button id="btnPlayMotion" type="button">播放動作</button>
        <button id="btnPauseMotion" type="button">暫停</button>
        <button id="btnStopMotion" type="button">停止</button>
        <button id="btnCopyJson" type="button">複製 JSON</button>
        <button id="btnDownloadJson" type="button">下載 JSON</button>
      </div>

      <fieldset class="lab-preview-control">
        <legend>Preview Mode</legend>
        <div class="lab-preview-options">
          <label>
            <input id="previewModeOriginal" type="radio" name="previewMode" value="original">
            <span>原始 VRMA</span>
          </label>
          <label>
            <input id="previewModeAgent" type="radio" name="previewMode" value="agent" checked>
            <span>Agent Pose</span>
          </label>
        </div>
      </fieldset>

      <label class="lab-slider">
        <span>取樣時間</span>
        <input id="sampleTime" type="range" min="0" max="0" step="0.033" value="0">
        <output id="sampleTimeLabel">0.000s / 0.000s</output>
      </label>

      <dl class="lab-summary">
        <div><dt>來源檔案</dt><dd id="sourceFile">未載入</dd></div>
        <div><dt>動畫長度</dt><dd id="durationLabel">0.000s</dd></div>
        <div><dt>骨架範圍</dt><dd>Upper Body</dd></div>
        <div><dt>預覽模式</dt><dd id="previewModeLabel">Agent Pose / 鎖定下半身</dd></div>
        <div><dt>匯出骨骼</dt><dd id="exportedBoneCount">0</dd></div>
      </dl>

      <section class="lab-warning-panel">
        <h2>警告</h2>
        <ul id="warningList"></ul>
      </section>

      <section class="lab-mining-panel">
        <h2>動作採礦紀錄 / Motion Mining Workbench</h2>
        <div class="lab-mining-grid">
          <label class="lab-field">
            <span>分類</span>
            <select id="miningCategory"></select>
          </label>
          <label class="lab-field">
            <span>分數</span>
            <select id="miningScore">
              <option value="5">5 / 高價值</option>
              <option value="4">4 / 可用</option>
              <option value="3" selected>3 / 待觀察</option>
              <option value="2">2 / 局部可參考</option>
              <option value="1">1 / 不可用</option>
            </select>
          </label>
          <label class="lab-field">
            <span>來源分數</span>
            <select id="miningSourceScore">
              <option value="5">5 / 原始很好</option>
              <option value="4">4 / 原始可用</option>
              <option value="3" selected>3 / 原始待觀察</option>
              <option value="2">2 / 局部參考</option>
              <option value="1">1 / 原始不可用</option>
            </select>
          </label>
          <label class="lab-field">
            <span>Agent 分數</span>
            <select id="miningAgentScore">
              <option value="5">5 / Agent 很好</option>
              <option value="4">4 / Agent 可用</option>
              <option value="3" selected>3 / Agent 待觀察</option>
              <option value="2">2 / 需未來能力</option>
              <option value="1">1 / Agent 不可用</option>
            </select>
          </label>
          <label class="lab-field lab-field-full">
            <span>淘汰原因</span>
            <select id="miningRejectReason"></select>
          </label>
          <label class="lab-field lab-field-full">
            <span>Future 原因</span>
            <select id="miningFutureReason"></select>
          </label>
          <label class="lab-field lab-field-full">
            <span>標籤</span>
            <input id="miningTags" type="text" value="upper_body, agent_friendly">
          </label>
          <label class="lab-field lab-field-full">
            <span>備註</span>
            <textarea id="miningNote" placeholder="例如：雙手自然打開，適合介紹"></textarea>
          </label>
        </div>
        <div class="lab-actions lab-mining-actions">
          <button id="btnAddMiningCandidate" type="button">加入候選</button>
          <button id="btnExportMiningLog" type="button">匯出 mining_log.json</button>
        </div>
        <ol id="miningCandidateList" class="lab-mining-list"></ol>
      </section>

      <section class="lab-json-panel">
        <h2>匯出 NaturalPosePreset</h2>
        <pre id="motion-template-json">{}</pre>
      </section>
    </aside>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
      "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import {
      VRMLoaderPlugin,
      VRMUtils,
    } from '@pixiv/three-vrm';
    import {
      createVRMAnimationClip,
      VRMAnimationLoaderPlugin,
      VRMLookAtQuaternionProxy,
    } from '@pixiv/three-vrm-animation';
    import {
      LOWER_BODY_PREVIEW_LOCK_BONES,
      MOTION_MINING_CATEGORIES,
      MOTION_MINING_REJECT_REASONS,
      UPPER_BODY_BONES,
      buildMotionMiningEntry,
      buildNaturalPosePreset,
      clampSampleTime,
      stableStringifyMiningLog,
      stableStringifyPreset,
    } from './js/MotionTemplateImporter.js';

    const EXAMPLE_VRMA_BASE = 'examples/m6_7_vrma_samples/';
    const DEG = Math.PI / 180;

    const els = {
      viewport: document.getElementById('labViewport'),
      loadState: document.getElementById('labLoadState'),
      fileInput: document.getElementById('vrmaFileInput'),
      exampleSelect: document.getElementById('exampleVrmaSelect'),
      btnLoadExample: document.getElementById('btnLoadExample'),
      btnSampleFirst: document.getElementById('btnSampleFirst'),
      btnSampleTime: document.getElementById('btnSampleTime'),
      btnPlayMotion: document.getElementById('btnPlayMotion'),
      btnPauseMotion: document.getElementById('btnPauseMotion'),
      btnStopMotion: document.getElementById('btnStopMotion'),
      btnCopyJson: document.getElementById('btnCopyJson'),
      btnDownloadJson: document.getElementById('btnDownloadJson'),
      previewModeOriginal: document.getElementById('previewModeOriginal'),
      previewModeAgent: document.getElementById('previewModeAgent'),
      previewModeLabel: document.getElementById('previewModeLabel'),
      sampleTime: document.getElementById('sampleTime'),
      sampleTimeLabel: document.getElementById('sampleTimeLabel'),
      sourceFile: document.getElementById('sourceFile'),
      durationLabel: document.getElementById('durationLabel'),
      exportedBoneCount: document.getElementById('exportedBoneCount'),
      warningList: document.getElementById('warningList'),
      json: document.getElementById('motion-template-json'),
      miningCategory: document.getElementById('miningCategory'),
      miningScore: document.getElementById('miningScore'),
      miningSourceScore: document.getElementById('miningSourceScore'),
      miningAgentScore: document.getElementById('miningAgentScore'),
      miningRejectReason: document.getElementById('miningRejectReason'),
      miningFutureReason: document.getElementById('miningFutureReason'),
      miningNote: document.getElementById('miningNote'),
      miningTags: document.getElementById('miningTags'),
      btnAddMiningCandidate: document.getElementById('btnAddMiningCandidate'),
      btnExportMiningLog: document.getElementById('btnExportMiningLog'),
      miningCandidateList: document.getElementById('miningCandidateList'),
    };

    let renderer;
    let scene;
    let camera;
    let controls;
    let clock;
    let vrm;
    let mixer;
    let action;
    let clip;
    let basePreset;
    let hipsBaseY = 0;
    let sourceFileName = '';
    let latestPreset = null;
    let isPlaying = false;
    let previewMode = 'agent';
    let sourceWarnings = [];
    const miningEntries = [];

    init().catch((err) => {
      setStatus('載入失敗');
      setWarnings([`初始化失敗：${err?.message || err}`]);
      console.error(err);
    });

    async function init() {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      els.viewport.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
      camera.position.set(0, 1.35, 3.3);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.25, 0);
      controls.enableDamping = true;
      controls.update();

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(1, 2, 2);
      scene.add(keyLight);

      clock = new THREE.Clock();
      await loadBasePreset();
      await loadAlicia();

      window.addEventListener('resize', resize);
      resize();
      renderer.setAnimationLoop(render);

      renderMiningOptions();
      renderMiningList();
      bindEvents();
      setWarnings([]);
      setStatus('已載入 Alicia');
      renderJson(basePreset);
    }

    async function loadBasePreset() {
      const loader = new THREE.FileLoader();
      loader.setResponseType('text');
      const text = await loader.loadAsync('motions/poses/alicia_solid.json');
      basePreset = JSON.parse(text);
    }

    async function loadAlicia() {
      const loader = new GLTFLoader();
      loader.crossOrigin = 'anonymous';
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const gltf = await loader.loadAsync('models/mascot.vrm');
      vrm = gltf.userData.vrm;

      VRMUtils.removeUnnecessaryVertices(vrm.scene);
      vrm.scene.traverse((obj) => {
        obj.frustumCulled = false;
      });

      if (vrm.lookAt) {
        const lookAtProxy = new VRMLookAtQuaternionProxy(vrm.lookAt);
        lookAtProxy.name = 'lookAtQuaternionProxy';
        vrm.scene.add(lookAtProxy);
      }

      scene.add(vrm.scene);
      const hips = getHumanoidBoneNode('hips');
      hipsBaseY = hips?.position?.y || 0;
      applyPreviewMode();
    }

    async function loadVrmaFile(file) {
      if (!file || !file.name.toLowerCase().endsWith('.vrma')) {
        throw new Error('請選擇 .vrma 檔案');
      }

      const url = URL.createObjectURL(file);
      try {
        await loadVrmaFromUrl(url, file.name);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function loadExampleVrma() {
      const fileName = els.exampleSelect.value || 'Relax.vrma';
      await loadVrmaFromUrl(`${EXAMPLE_VRMA_BASE}${encodeURIComponent(fileName)}`, fileName);
    }

    async function loadVrmaFromUrl(url, fileName) {
      stopPlayback({ resetPose: false, silent: true });

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
      const loaderWarnings = [];
      const gltf = await withSuppressedVrmaWarnings(() => loader.loadAsync(url), loaderWarnings);
      const vrmAnimation = gltf.userData.vrmAnimations?.[0];
      if (!vrmAnimation) throw new Error('找不到 VRM Animation');

      clip = createVRMAnimationClip(vrmAnimation, vrm);
      mixer = new THREE.AnimationMixer(vrm.scene);
      action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.play();
      mixer.addEventListener('finished', handlePlaybackFinished);

      sourceFileName = fileName;
      sourceWarnings = loaderWarnings;
      els.sourceFile.textContent = fileName;
      els.sampleTime.max = String(clip.duration || 0);
      els.sampleTime.value = '0';
      els.durationLabel.textContent = `${formatSeconds(clip.duration || 0)}s`;
      updateTimeLabel(0);
      setStatus('已載入 VRMA');
      sampleAt(0);
    }

    function sampleAt(value) {
      if (!vrm || !mixer || !action || !clip) {
        setWarnings(['請先載入 VRMA']);
        return;
      }

      const duration = clip.duration || 0;
      const sampleTime = clampSampleTime(value, duration);
      const warnings = [...sourceWarnings];
      const rotations = {};

      isPlaying = false;
      refreshCurrentFrame(sampleTime);

      for (const bone of UPPER_BODY_BONES) {
        const node = getHumanoidBoneNode(bone);
        if (!node) {
          warnings.push(`缺少骨骼：${bone}`);
          continue;
        }

        rotations[bone] = {
          x: THREE.MathUtils.radToDeg(node.rotation.x),
          y: THREE.MathUtils.radToDeg(node.rotation.y),
          z: THREE.MathUtils.radToDeg(node.rotation.z),
        };

        if (Math.max(Math.abs(rotations[bone].x), Math.abs(rotations[bone].y), Math.abs(rotations[bone].z)) > 120) {
          warnings.push(`角度偏大：${bone}`);
        }
      }

      latestPreset = buildNaturalPosePreset({
        basePreset,
        rotations,
        source: {
          type: 'vrma',
          fileName: sourceFileName,
          sampleTime,
        },
        warnings,
      });

      els.sampleTime.value = String(sampleTime);
      updateTimeLabel(sampleTime);
      els.exportedBoneCount.textContent = String(Object.keys(rotations).length);
      setWarnings(warnings);
      renderJson(latestPreset);
      setStatus('已取樣');
    }

    function getHumanoidBoneNode(bone) {
      return vrm?.humanoid?.getNormalizedBoneNode?.(bone)
        || vrm?.humanoid?.getRawBoneNode?.(bone)
        || null;
    }

    function applyLowerBodyPreviewLock() {
      if (!vrm || !basePreset) return;

      const basePose = basePreset.basePose || {};
      const rotations = basePose.rotation || {};
      const positions = basePose.position || {};

      for (const boneName of LOWER_BODY_PREVIEW_LOCK_BONES) {
        const bone = getHumanoidBoneNode(boneName);
        if (!bone) continue;

        const pose = rotations[boneName] || { x: 0, y: 0, z: 0 };
        bone.rotation.set(
          (pose.x || 0) * DEG,
          (pose.y || 0) * DEG,
          (pose.z || 0) * DEG,
        );
      }

      const hips = getHumanoidBoneNode('hips');
      const hipsPose = positions.hips;
      if (hips && hipsPose) {
        hips.position.x = hipsPose.x || 0;
        hips.position.y = hipsBaseY + (hipsPose.y || 0);
        hips.position.z = hipsPose.z || 0;
      }
    }

    function applyPreviewMode() {
      updatePreviewModeLabel();
      if (previewMode === 'agent') {
        applyLowerBodyPreviewLock();
      }
    }

    function refreshCurrentFrame(value = Number(els.sampleTime.value || 0)) {
      if (!mixer || !action || !clip) {
        applyPreviewMode();
        return 0;
      }

      const sampleTime = clampSampleTime(value, clip.duration || 0);
      // paused 會讓 Three.js 將 action 視為 timeScale 0，導致指定時間採樣失準。
      action.enabled = true;
      action.paused = false;
      action.timeScale = 1;
      action.time = sampleTime;
      action.play();
      mixer.setTime(sampleTime);
      mixer.update(0);
      applyPreviewMode();
      vrm.update?.(0);
      return sampleTime;
    }

    function setPreviewMode(mode) {
      previewMode = mode === 'original' ? 'original' : 'agent';
      refreshCurrentFrame(Number(els.sampleTime.value || 0));
      setStatus(previewMode === 'original' ? '預覽原始 VRMA' : '預覽 Agent Pose');
    }

    function updatePreviewModeLabel() {
      els.previewModeLabel.textContent = previewMode === 'original'
        ? 'Original VRMA / 完整動作'
        : 'Agent Pose / 鎖定下半身';
    }

    async function withSuppressedVrmaWarnings(fn, warnings) {
      const originalWarn = console.warn;
      console.warn = (...args) => {
        const message = args.map((arg) => String(arg)).join(' ');
        if (message.includes('VRMAnimationLoaderPlugin: specVersion of the VRMA is not defined')) {
          warnings.push('VRMA 缺少 specVersion，已按 1.0 載入。');
          return;
        }
        originalWarn(...args);
      };

      try {
        return await fn();
      } finally {
        console.warn = originalWarn;
      }
    }

    function renderJson(preset) {
      latestPreset = preset;
      els.json.textContent = stableStringifyPreset(preset || {});
    }

    async function copyJson() {
      const text = els.json.textContent || '{}';
      await navigator.clipboard.writeText(text);
      setStatus('已複製 JSON');
    }

    function downloadJson() {
      const text = els.json.textContent || '{}';
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `alicia_solid_from_vrma_${formatSeconds(Number(els.sampleTime.value || 0)).replace('.', '_')}s.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('匯出完成');
    }

    function addMiningCandidate() {
      if (!latestPreset || !sourceFileName) {
        setWarnings(['請先載入 VRMA 並取樣後再加入候選']);
        return;
      }

      const category = els.miningCategory.value || 'present';
      const sequence = miningEntries.filter((entry) => entry.category === category).length + 1;
      const entry = buildMotionMiningEntry({
        source: sourceFileName,
        sampleTime: Number(els.sampleTime.value || 0),
        category,
        score: Number(els.miningScore.value || 3),
        sourceScore: Number(els.miningSourceScore.value || 3),
        agentScore: Number(els.miningAgentScore.value || 3),
        rejectReason: els.miningRejectReason.value,
        reason: els.miningFutureReason.value,
        note: els.miningNote.value,
        tags: els.miningTags.value,
        sequence,
      });

      miningEntries.push(entry);
      renderMiningList();
      setStatus(`已加入候選 ${entry.id}`);
    }

    function downloadMiningLog() {
      if (miningEntries.length === 0) {
        setWarnings(['目前沒有候選紀錄可匯出']);
        return;
      }

      const blob = new Blob([stableStringifyMiningLog(miningEntries)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mining_log.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('已匯出 mining_log.json');
    }

    function renderMiningOptions() {
      els.miningCategory.replaceChildren(...MOTION_MINING_CATEGORIES.map((category) => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = getCategoryLabel(category);
        return option;
      }));

      els.miningRejectReason.replaceChildren(...MOTION_MINING_REJECT_REASONS.map((reason) => {
        const option = document.createElement('option');
        option.value = reason;
        option.textContent = reason;
        return option;
      }));

      els.miningFutureReason.replaceChildren(...MOTION_MINING_REJECT_REASONS
        .filter((reason) => reason.startsWith('requires_'))
        .map((reason) => {
          const option = document.createElement('option');
          option.value = reason;
          option.textContent = reason;
          return option;
        }));

      updateRejectReasonState();
    }

    function renderMiningList() {
      if (miningEntries.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = '尚無候選';
        els.miningCandidateList.replaceChildren(empty);
        return;
      }

      els.miningCandidateList.replaceChildren(...miningEntries.map((entry) => {
        const li = document.createElement('li');
        const reason = entry.rejectReason ? ` / ${entry.rejectReason}` : '';
        const futureReason = entry.reason ? ` / ${entry.reason}` : '';
        const file = entry.exportedPoseFile ? ` / ${entry.exportedPoseFile}` : '';
        const title = document.createElement('strong');
        title.textContent = entry.id;
        const meta = document.createTextNode(` ${entry.source} @ ${formatSeconds(entry.sampleTime)}s / ${entry.category}${reason}${futureReason} / ${entry.score} 分 / source ${entry.sourceScore} / agent ${entry.agentScore}${file}`);
        const note = document.createElement('span');
        note.textContent = entry.note || '無備註';
        li.append(title, meta, document.createElement('br'), note);
        return li;
      }));
    }

    function updateRejectReasonState() {
      const category = els.miningCategory.value;
      const isReject = category === 'reject';
      const isFuture = category === 'candidate_future';
      els.miningRejectReason.disabled = !isReject;
      els.miningFutureReason.disabled = !isFuture;

      const currentTags = els.miningTags.value.trim();
      if (isReject && (!currentTags || currentTags === 'upper_body, agent_friendly')) {
        els.miningTags.value = 'negative_sample';
        return;
      }
      if (isFuture && (!currentTags || currentTags === 'upper_body, agent_friendly' || currentTags === 'negative_sample')) {
        els.miningTags.value = 'future_candidate, requires_lower_body';
        return;
      }
      if (!isReject && !isFuture && (!currentTags || currentTags === 'negative_sample' || currentTags === 'future_candidate, requires_lower_body')) {
        els.miningTags.value = 'upper_body, agent_friendly';
      }
    }

    function getCategoryLabel(category) {
      const labels = {
        present: '介紹 present',
        point: '指向 point',
        think: '思考 think',
        warning: '警告 warning',
        success: '成功 success',
        candidate_future: '未來候選 candidate_future',
        reject: '淘汰 reject',
      };
      return labels[category] || category;
    }

    function playMotion() {
      if (!mixer || !action || !clip) {
        setWarnings(['請先載入 VRMA']);
        return;
      }

      const duration = clip.duration || 0;
      let startTime = clampSampleTime(Number(els.sampleTime.value || 0), duration);
      if (duration > 0 && startTime >= duration - 0.034) {
        startTime = 0;
      }
      action.enabled = true;
      action.paused = false;
      action.timeScale = 1;
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.time = startTime;
      action.play();
      mixer.setTime(startTime);
      applyPreviewMode();
      isPlaying = true;
      updateTimeLabel(startTime);
      setStatus('播放中');
    }

    function pauseMotion() {
      if (!action || !clip) {
        setWarnings(['請先載入 VRMA']);
        return;
      }

      isPlaying = false;
      action.paused = true;
      const pausedTime = clampSampleTime(action.time || Number(els.sampleTime.value || 0), clip.duration || 0);
      els.sampleTime.value = String(pausedTime);
      updateTimeLabel(pausedTime);
      setStatus('已暫停');
    }

    function stopPlayback({ resetPose = true, silent = false } = {}) {
      isPlaying = false;
      if (!action) return;

      action.paused = false;
      action.enabled = true;
      action.stop();

      if (resetPose && clip) {
        sampleAt(0);
      }

      if (!silent) {
        setStatus('已停止');
      }
    }

    function handlePlaybackFinished() {
      isPlaying = false;
      if (!clip || !action) return;

      const finishedTime = clampSampleTime(action.time || clip.duration || 0, clip.duration || 0);
      els.sampleTime.value = String(finishedTime);
      updateTimeLabel(finishedTime);
      setStatus('播放完成');
    }

    function bindEvents() {
      els.fileInput.addEventListener('change', async () => {
        try {
          const file = els.fileInput.files?.[0];
          await loadVrmaFile(file);
        } catch (err) {
          setStatus('無法讀取 VRMA');
          setWarnings([err?.message || String(err)]);
          console.error(err);
        }
      });

      els.btnLoadExample.addEventListener('click', () => {
        loadExampleVrma().catch((err) => {
          setStatus('無法讀取範例');
          setWarnings([err?.message || String(err)]);
          console.error(err);
        });
      });
      els.btnSampleFirst.addEventListener('click', () => sampleAt(0));
      els.btnSampleTime.addEventListener('click', () => sampleAt(Number(els.sampleTime.value || 0)));
      els.sampleTime.addEventListener('input', () => updateTimeLabel(Number(els.sampleTime.value || 0)));
      els.previewModeOriginal.addEventListener('change', () => setPreviewMode('original'));
      els.previewModeAgent.addEventListener('change', () => setPreviewMode('agent'));
      els.btnPlayMotion.addEventListener('click', playMotion);
      els.btnPauseMotion.addEventListener('click', pauseMotion);
      els.btnStopMotion.addEventListener('click', () => stopPlayback());
      els.miningCategory.addEventListener('change', updateRejectReasonState);
      els.btnAddMiningCandidate.addEventListener('click', addMiningCandidate);
      els.btnExportMiningLog.addEventListener('click', downloadMiningLog);
      els.btnCopyJson.addEventListener('click', () => copyJson().catch((err) => {
        setWarnings([`複製失敗：${err?.message || err}`]);
        console.error(err);
      }));
      els.btnDownloadJson.addEventListener('click', downloadJson);
    }

    function render() {
      const dt = clock.getDelta();
      controls.update();
      if (isPlaying && mixer && action && clip) {
        mixer.update(dt);
        applyPreviewMode();
        const currentTime = clampSampleTime(action.time || 0, clip.duration || 0);
        els.sampleTime.value = String(currentTime);
        updateTimeLabel(currentTime);
      }
      vrm?.update?.(dt);
      renderer.render(scene, camera);
    }

    function resize() {
      const rect = els.viewport.getBoundingClientRect();
      const width = Math.max(1, rect.width);
      const height = Math.max(1, rect.height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    function setStatus(text) {
      els.loadState.textContent = text;
    }

    function setWarnings(warnings = []) {
      const list = warnings.length ? warnings : ['無'];
      els.warningList.replaceChildren(...list.map((item) => {
        const li = document.createElement('li');
        li.textContent = item;
        return li;
      }));
    }

    function updateTimeLabel(value) {
      els.sampleTimeLabel.textContent = `${formatSeconds(value)}s / ${formatSeconds(clip?.duration || 0)}s`;
    }

    function formatSeconds(value) {
      return Number(value || 0).toFixed(3);
    }
  </script>
</body>
</html>
