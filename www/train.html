<!--
    模型訓練
    放置位置為 data/projects/三國迷因/train_pt/train_{index} 1~N
-->
<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>我的 yolo 訓練機</title>
    <script src="/www/js/jquery.min.js"></script>
    <script src="/www/js/jquery-m.min.js"></script>
    <script src="/www/js/jquery-ui-1.8.24/ui/minified/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="/www/js/jquery-ui-1.8.24/themes/base/minified/jquery-ui.min.css" />
    <script src="/www/js/myphp.js"></script>
    <script src="/www/js/mybox.js"></script>
    <script src="/www/js/include.js?v=3"></script>
    <link rel="stylesheet" href="/www/css/reset.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/www/css/style.css" />
    <style nonce="gg">
        .thetable {
            width: 100%;
        }

            .thetable th, .thetable td {
                padding: 3px;
            }

        .taskTableClass thead th[field='step'] {
            width: 75px;
        }

        .taskTableClass thead th[field='sdt'] {
            width: 115px;
        }

        .taskTableClass thead th[field='edt'] {
            width: 115px;
        }

        .taskTableClass thead th[field='fake_kinds'] {
            width: 100px;
        }

        .taskTableClass thead th[field='fake_train_percent_val_percent'] {
            width: 140px;
        }

        .taskTableClass thead th[field='fake_options'] {
            width: 285px;
        }


        .taskTableClass tbody td[field='step'] {
            text-align: right;
            padding-right: 18px;
        }

        .taskTableClass tbody td[field='sdt'] {
            text-align: center;
        }

        .taskTableClass tbody td[field='edt'] {
            text-align: center;
        }

        .taskTableClass tbody td[field='fake_kinds'] {
            text-align: right;
            padding-right: 18px;
            cursor: pointer;
        }

        .taskTableClass tbody td[field='fake_train_percent_val_percent'] {
            text-align: center;
        }

        .taskTableClass tbody td[field='fake_status'] {
            text-align: center;
        }

        .taskTableClass tbody td[field='fake_options'] {
            text-align: center;
        }

        .myWClass {
            /*min-height: 80px;*/
            max-height: 450px;
            overflow: auto;
            padding: 8px;
        }

            .myWClass tbody td[field='項次'] {
                text-align: right;
                padding-right: 15px;
            }

        .h2drag {
            text-align: center;
            cursor: move;
            background-color: aquamarine;
        }

        .iframeDetailClass {
            width: 80%;
            height: 70%;
        }
    </style>
</head>
<body class="container mt-5">
    <div align="right">
        <input type="button" class="btn btn-info" value="重新整理" reqc="btnRefresh" />
        <input type="button" class="btn btn-primary" value="建立訓練" reqc="btnAddTrain" />
    </div>
    <hr />
    <!--放已訓練列表-->
    <div reqc="divTrainLists"></div>
</body>
</html>
<script nonce="gg">
    // 載入已訓練列表
    var GETS = getGET();
    var project_name = GETS['project_name'];
    var app = {
        "method": {
            "ui_init": function () {
                // UI 畫面操作
                $("input[reqc='btnRefresh']").off().click(function () {
                    location.reload();
                });

                // 建立訓練
                $("input[reqc='btnAddTrain']").off().click(function () {
                    // 彈出視窗
                    window['wh'] = getWindowSize();
                    var w70 = window['wh']['width'] * 0.7;
                    var h80 = window['wh']['height'] * 0.8;
                    var trainURL = "/www/template/train_add_edit_form.html?domode=add&project_name=" + encodeURIComponent(project_name);
                    parent.dialogMyBoxOn(`<iframe class="theiframe" style="width:${w70}px;height:${h80}px;" src="${trainURL}"></iframe>`, true, function () { });
                });
            },
            "updateDomStatus": function (dom) {
                var o = {
                    "project_name": $(dom).attr("req_project_name"),
                    "task_name": $(dom).attr("req_task_name")
                };
                //console.log("Get task status...: " + index);
                console.log(o);
                var _dom = dom;
                myAjax_async_json("/api?mode=train_get_task_status", o, function (jd) {
                    if (jd['status'] == 'OK') {
                        var status_progress = parseFloat(jd.data['status_progress']).toFixed(2);
                        if (jd['data']['train_results'] != "") {
                            // 從 csv 內容解算進度
                            // 從 jobs 取出 epoch 總數
                            var jd_job = json_decode(jd['data']['job'], true);
                            console.log(jd_job);
                            // 進度為
                            // 50~95 % 為 epoch 0~結束
                            var user_defind_epoch = parseFloat(jd_job['epoch'])
                            var now_epoch_step = 0;
                            var csv_results = str_replace("\r", "", jd['data']['train_results']).trim();
                            var m_csv_last = explode(",", end(explode("\n", csv_results))); // 1~10
                            if (!isNaN(m_csv_last[0])) {
                                // 進度轉換
                                now_epoch_step = m_csv_last[0];
                                if (now_epoch_step != user_defind_epoch) {
                                    status_progress = arduino_map(parseFloat(m_csv_last[0]), 1.0, user_defind_epoch, 50.0, 95.0);
                                }
                                // 一樣代表已最後一筆或完成，照原進度走
                            }
                        }
                        status_progress = sprintf("%.2f", status_progress);
                        $(`span[reqc='spanProgress'][req_task_name='${jd['task_name']}']`).text(status_progress + " %");

                        if (status_progress >= 100) {
                            if ($("div[id^='myW_']").length == 0) {
                                parent.$("a[reqc='a模型訓練']").trigger("click");
                            }
                            return;
                        }
                        (function (_jd) {
                            setTimeout(function () {
                                app.method.updateDomStatus($(`span[reqc='spanProgress'][req_task_name='${_jd['task_name']}']`)[0]);
                            }, 1000);
                        })(jd);
                    }
                });
            },
            "listTrained": function () {
                // 載入列表
                var o = {
                    "project_name": project_name
                };
                myAjax_async_json("/api?mode=train_lists", o, function (jd) {
                    jd.data.map(function (v, i) {
                        v.step = (i + 1);
                        v.sdt = date("Y-m-d H:i:s", end(explode("_", v.task_name)));
                        v.edt = "--";
                        var ojob_data = json_decode(v.job_data);
                        for (var k in ojob_data) {
                            v[k] = ojob_data[k];
                        }
                        v.fake_train_percent_val_percent = `${v.train_percent} / ${v.val_percent}`;
                        var mkinds = explode("|||3WA|||", v.kinds);
                        var mt = [];
                        mkinds.map(function (mkv, mkvi) {
                            mt.push({
                                "項次": (mkvi + 1),
                                "類別名稱": mkv
                            });
                        });
                        var html = base64_encode(print_table(mt, "項次,類別名稱", "項次,類別名稱", ""));
                        v.fake_kinds = `<span req_html="${html}" reqc="spanDetail" class="blue underline bold">${mkinds.length}</span>`;
                        v.fake_status = "";
                        v.fake_options = "";
                        switch (v.status.toString()) {
                            case "0":
                                v.fake_status = "待命中";
                                v.fake_options = `
                                    <input type="button" class="btn btn-info margin2px" value="細節" reqc="btnDetail" req_project_name="${project_name}" req_task_name="${v.task_name}">
                                    <input type="button" class="btn btn-danger margin2px" value="刪除">
                                `;
                                break;
                            case "1":
                                v.fake_status = `訓練中...<span reqc="spanProgress" req_project_name="${project_name}" req_task_name="${v.task_name}"></span>`;
                                v.fake_options = `
                                    <input type="button" class="btn btn-info margin2px" value="細節" reqc="btnDetail" req_project_name="${project_name}" req_task_name="${v.task_name}">
                                    <input type="button" class="btn btn-danger margin2px" value="停止">
                                `;
                                break;
                            case "2":
                                v.fake_status = "完成";
                                v.fake_options = `
                                    <input type="button" class="btn btn-primary margin2px" value="下載模型(pt)">
                                    <input type="button" class="btn btn-info margin2px" value="下載模型(手機版)">
                                    <br>
                                    <input type="button" class="btn btn-info margin2px" value="細節" reqc="btnDetail" req_project_name="${project_name}" req_task_name="${v.task_name}">
                                    <input type="button" class="btn btn-warning margin2px" value="重新訓練" reqc="btnRetrain" req_project_name="${project_name}" req_task_name="${v.task_name}">
                                    <input type="button" class="btn btn-danger margin2px" value="刪除">
                                `;
                                break;
                        }

                    });
                    //table = print_table(jd.data);
                    var table = print_table(jd.data,
                        "step,task_name,sdt,edt,fake_kinds,fake_train_percent_val_percent,fake_status,fake_options",
                        "項次,任務名稱,建立時間,完成時間,類別總數,訓驗/驗證比例,狀態,功能",
                        "thetable taskTableClass");
                    $("div[reqc='divTrainLists']").html(table);

                    // 訓練中的自動更新進度
                    $(`span[reqc='spanProgress']`).each(function (index, dom) {
                        app.method.updateDomStatus(dom);
                    });

                    // 按下細節
                    $("input[reqc='btnDetail']").off().click(function () {
                        var o = {
                            "project_name": $(this).attr('req_project_name'),
                            "task_name": $(this).attr('req_task_name')
                        };
                        var wh = getWindowSize();
                        var w85px = wh['width'] * 0.85;
                        var h75px = wh['height'] * 0.75;
                        parent.dialogMyBoxOn(`<iframe style="width:${w85px}px;height:${h75px}px;" src="/www/show_detail.html?project_name=${encodeURIComponent(o.project_name)}&task_name=${encodeURIComponent(o.task_name)}"></iframe>`, true, function () { });
                    });

                    // 按重新訓練
                    $("input[reqc='btnRetrain']").off().click(function () {
                        if (confirm("確定要重轉嗎??") == false) { return; }
                        var dom = $(this)[0];
                        var o = {
                            "project_name": $(dom).attr("req_project_name"),
                            "task_name": $(dom).attr("req_task_name")
                        };
                        //console.log("Get task status...: " + index);
                        console.log(o);
                        myAjax_async_json("/api?mode=train_retrain", o, function (jd) {
                            if (jd['status'] == 'OK') {
                                parent.smallComment("已註冊重新訓練...", 2000, false, {});
                                setTimeout(function () {
                                    location.reload();
                                }, 1000);
                            }
                        });
                    });


                    // 滑鼠移到類別的浮動視窗
                    $("span[reqc='spanDetail']").off().click(function () {
                        $("div[id^='myW_']").remove();
                        var html = base64_decode($(this).attr('req_html'));
                        myW(`<div class="myWClass">
                                <h2 class="h2drag">項目列表</h2>
                                <img src="/www/pic/x_close_32.png" style="position:absolute;right:0px;top:0px;cursor:pointer;" reqc="imgXClose">
                                ${html}</div>`, function (myWid) {
                            $("img[reqc='imgXClose']").off().click(function () {
                                $("div[id^='myW_']").remove();
                            });

                            // 可拖移
                            $("#" + myWid).draggable({
                                "handle": ".h2drag"
                            });
                        });
                    });


                }); // ajax
            }
        },
        "init": function () {
            app.method.ui_init();
            app.method.listTrained();
        }
    };
    app.init();
</script>
