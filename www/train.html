    放置位置為 data/projects/三國迷因/train_pt/train_{index} 1~N

<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>我的 yolo 訓練機</title>
    <script src="/www/js/jquery.min.js"></script>
    <script src="/www/js/myphp.js"></script>
    <script src="/www/js/mybox.js"></script>
    <script src="/www/js/include.js"></script>
    <link rel="stylesheet" href="/www/css/reset.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/www/css/style.css" />
    <style nonce="gg">
        .thetable {
            width: 100%;
        }
    </style>
</head>
<body class="container mt-5">
    <div align="right">
        <input type="button" class="btn btn-info" value="重新整理" reqc="btnRefresh" />
        <input type="button" class="btn btn-primary" value="建立訓練" reqc="btnAddTrain" />
    </div>
    <hr />
    <!--放已訓練列表-->
    <div reqc="divTrainLists"></div>
</body>
</html>
<script nonce="gg">
    // 載入已訓練列表
    var GETS = getGET();
    var project_name = GETS['project_name'];
    var app = {
        "method": {
            "ui_init": function () {
                // UI 畫面操作
                $("input[reqc='btnRefresh']").off().click(function () {
                    location.reload();
                });

                // 建立訓練
                $("input[reqc='btnAddTrain']").off().click(function () {
                    // 彈出視窗
                    window['wh'] = getWindowSize();
                    var w70 = window['wh']['width'] * 0.7;
                    var h80 = window['wh']['height'] * 0.8;
                    var trainURL = "template/train_add_edit_form.html?domode=add&project_name=" + encodeURIComponent(project_name);
                    parent.dialogMyBoxOn(`<iframe class="theiframe" style="width:${w70}px;height:${h80}px;" src="${trainURL}"></iframe>`, true, function () { });
                });
            },
            "listTrained": function () {
                // 載入列表
            }
        },
        "init": function () {
            app.method.ui_init();
            app.method.listTrained();
        }
    };
    app.init();
</script>
